function invM(id){
  var c=fc(id),s=stat(c),now=today().slice(0,7),sm=c.start.slice(0,7),mo=s.mo,r="",td=0,tp=0,cd=0,cp=0,by={};

  due:function(){return "<h2>"+t("due")+"</h2>"+custRows(D.c.filter(function(c){return stat(c).ov>0}).sort(function(a,b){return stat(b).ov-stat(a).ov}))},
  stock:function(){
    return "<h2>"+t("stock")+"</h2><div class=bar><button class='b p' onclick=addI()>"+t("add")+"</button></div>"+(D.i.length?"<div class=tw><table><tr><th>"+t("name")+"</th><th>"+t("qty")+"</th><th>"+t("cost")+"</th><th>"+t("price")+"</th><th></th></tr>"+D.i.map(function(i,n){return "<tr><td>"+esc(i.name)+(i.qty<=2?" <span class=red>⚠ "+t("low")+"</span>":"")+"</td><td><button class='b s' onclick=qt("+n+",-1)>−</button> "+i.qty+" <button class='b s' onclick=qt("+n+",1)>+</button></td><td>"+rs(i.cost)+"</td><td>"+rs(i.price)+"</td><td><button class='b s' onclick=editI("+n+")>"+t("edit")+"</button> <button class='b s r' onclick=delI("+n+")>"+t("del")+"</button></td></tr>"}).join("")+"</table></div>":"<p>"+t("none")+"</p>");
  },

<script>
(function(){
  var rm=matchMedia("(prefers-reduced-motion: reduce)").matches,fine=matchMedia("(pointer:fine)").matches;
  function cnt(root){
    if(rm)return;
    root.querySelectorAll(".k b").forEach(function(b){
      var m=b.textContent.match(/\d[\d,]*/);if(!m)return;
      var end=+m[0].replace(/,/g,""),txt=b.textContent,t0=performance.now();
      (function f(n){var p=Math.min(1,(n-t0)/900),v=Math.round(end*(1-Math.pow(1-p,3)));b.textContent=txt.replace(m[0],v.toLocaleString("en-US"));if(p<1)requestAnimationFrame(f)})(t0);
    });
  }
  var _r=render;
  render=function(){_r();if(tab=="dash")cnt($("#main"))};
  var _d=det;
  det=function(id){
    _d(id);
    var c=fc(id),s=stat(c),pc=Math.min(100,Math.round(s.paid/c.total*100)),g=$("#m .grid");
    if(g){g.insertAdjacentHTML("afterend","<div class=pb title='"+pc+"%'><i></i></div>");setTimeout(function(){var i=$("#m .pb i");if(i)i.style.width=pc+"%"},60);cnt($("#m"))}
  };
  render();
  var cv=$("#dust"),cx=cv.getContext("2d"),P=[],W,H,sy=0;
  function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
  rs();addEventListener("resize",rs);addEventListener("scroll",function(){sy=scrollY},{passive:true});
  for(var i=0;i<(innerWidth<700?24:46);i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.5,s:Math.random()*.3+.08,d:Math.random()*.6+.2,a:Math.random()*.4+.15});
  function dr(){
    cx.clearRect(0,0,W,H);
    P.forEach(function(p){
      p.y-=p.s;p.x+=Math.sin((p.y+p.x)/90)*.25;
      if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      var yy=(p.y-sy*p.d*.2)%H;if(yy<0)yy+=H;
      cx.beginPath();cx.arc(p.x,yy,p.r,0,6.283);cx.fillStyle="rgba(212,175,55,"+p.a+")";cx.fill();
    });
    requestAnimationFrame(dr);
  }
  if(!rm)dr();
  if(fine&&!rm){
    var cg=$("#cg");
    addEventListener("pointermove",function(e){cg.style.opacity=1;cg.style.transform="translate("+e.clientX+"px,"+e.clientY+"px)"},{passive:true});
    document.addEventListener("pointermove",function(e){
      var k=e.target.closest&&e.target.closest(".k");
      if(!k)return;
      var r=k.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      k.style.transition="transform .1s";
      k.style.transform="perspective(700px) rotateX("+(-y*10)+"deg) rotateY("+(x*10)+"deg) translateY(-4px)";
    });
    document.addEventListener("pointerout",function(e){var k=e.target.closest&&e.target.closest(".k");if(k){k.style.transition="";k.style.transform=""}});
  }
})();
</script>

<script>
(function(){

<script>
(function(){

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  T.pinreq=["Enter your PIN to confirm","تصدیق کے لیے اپنا پن درج کریں"];T.conf=["Confirm","تصدیق"];
  T.xl=["📥 Download Excel file","📥 ایکسل فائل ڈاؤن لوڈ کریں"];T.xr=["📤 Restore from Excel","📤 ایکسل سے بحال کریں"];
  T.lb=["Last backup","آخری بیک اپ"];T.nv=["never","کبھی نہیں"];T.td=["today","آج"];T.dago=["days ago","دن پہلے"];
  T.noxl=["Excel tool could not load. Check internet and try again.","ایکسل ٹول لوڈ نہیں ہوا۔ انٹرنیٹ چیک کر کے دوبارہ کوشش کریں۔"];
  T.nodl=["File saving is not available here. Use the copy backup below.","یہاں فائل محفوظ کرنا ممکن نہیں۔ نیچے والا کاپی بیک اپ استعمال کریں۔"];
  T.saved=["File saved. Keep it somewhere safe (Google Drive, or WhatsApp it to yourself).","فائل محفوظ ہو گئی۔ اسے محفوظ جگہ رکھیں (گوگل ڈرائیو، یا واٹس ایپ پر خود کو بھیج دیں)۔"];
  T.badx=["This is not a valid backup Excel file","یہ درست بیک اپ ایکسل فائل نہیں ہے"];
  function nzp(v){return String(v||"").replace(/[\u06F0-\u06F9]/g,function(d){return d.charCodeAt(0)-0x06F0}).replace(/[\u0660-\u0669]/g,function(d){return d.charCodeAt(0)-0x0660}).replace(/\s/g,"")}
  function msg(x,c){openM("<p class="+c+">"+x+"</p><div class=row><button class=b onclick=closeM()>"+t("close")+"</button></div>")}
  window.askPin=function(fn){
    var w=RW?t("rw"):"";RW=0;
    FC={pf:fn};
    openM("<h3>"+t("pinreq")+"</h3>"+(w?"<p class=red>"+w+"</p>":"")+"<label>"+t("ep")+"<input id=dp type=password inputmode=numeric maxlength=8 onkeydown=\"if(event.key=='Enter')pinOk()\"></label><p id=de class=red></p><div class=row><button class='b r' onclick=pinOk()>"+t("conf")+"</button><button class=b onclick=closeM()>"+t("cancel")+"</button></div>");
    setTimeout(function(){var e=$("#dp");if(e&&e.focus)e.focus()},60);
  };
  window.pinOk=function(){
    if(nzp($("#dp").value)!==nzp(pinv)){$("#de").textContent=t("wp");return}
    var f=FC.pf;closeM();f();
  };
  delC=function(id){askPin(function(){D.c=D.c.filter(function(c){return c.id!=id});sv();render()})};
  delP=function(id,i){var c=fc(id);askPin(function(){c.pay.splice(i,1);sv();det(id)})};
  rest=function(){
    var o;
    try{o=JSON.parse($("#bt").value);if(!(o&&o.c&&o.i&&o.v))throw 0}catch(e){msg(t("badbk"),"red");return}
    RW=1;askPin(function(){D=o;sv();tab="dash";render()});
  };
  function hb(k){return T[k][0]+" / "+T[k][1]}
  function sh(h,rows,w){var ws=XLSX.utils.aoa_to_sheet([h].concat(rows));ws["!cols"]=h.map(function(x,i){return{wch:w&&w[i]?w[i]:16}});return ws}
  window.xl=function(){
    if(typeof XLSX==="undefined"){msg(t("noxl"),"red");return}
    var wb=XLSX.utils.book_new();
    var cr=D.c.map(function(c){var s=stat(c);return [c.khata||"",c.name,c.phone,c.cnic,c.addr,c.guar,c.item,c.total,c.adv,c.months,Math.round(s.mo),c.start,Math.round(s.paid),Math.round(s.rem),Math.round(s.ov)]});
    XLSX.utils.book_append_sheet(wb,sh(["kh","name","phone","cnic","addr","guar","item","total","adv","months","mo","start","paid","rem","ov"].map(hb),cr,[16,22,16,20,30,26,20,12,12,10,12,12,12,12,12]),"Customers");
    var pr=[];
    D.c.forEach(function(c){
      pr.push([c.khata||"",c.name,c.start,c.adv,"Advance / ایڈوانس"]);
      c.pay.slice().sort(function(a,b){return a.d<b.d?-1:1}).forEach(function(p){pr.push([c.khata||"",c.name,p.d,p.a,"Installment / قسط"])});
    });
    XLSX.utils.book_append_sheet(wb,sh(["kh","name","date","amt"].map(hb).concat(["Type / قسم"]),pr,[16,22,14,12,20]),"Payments");
    var dr=D.c.map(function(c){return{c:c,s:stat(c)}}).filter(function(x){return x.s.ov>0}).sort(function(a,b){return b.s.ov-a.s.ov}).map(function(x){return [x.c.khata||"",x.c.name,x.c.phone,x.c.item,Math.round(x.s.mo),Math.round(x.s.ov),Math.round(x.s.rem)]});
    XLSX.utils.book_append_sheet(wb,sh(["kh","name","phone","item","mo","ov","rem"].map(hb),dr,[16,22,16,20,14,14,14]),"Due List");
    XLSX.utils.book_append_sheet(wb,sh(["name","qty","cost","price"].map(hb),D.i.map(function(i){return [i.name,i.qty,i.cost,i.price]}),[24,10,12,12]),"Inventory");
    XLSX.utils.book_append_sheet(wb,sh(["name","phone","owed","note"].map(hb),D.v.map(function(v){return [v.name,v.phone,v.owed,v.note]}),[24,16,14,24]),"Vendors");
    var j=JSON.stringify(D),ch=[];for(var i=0;i<j.length;i+=30000)ch.push([j.slice(i,i+30000)]);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ch.length?ch:[[""]]),"DATA");
    var buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    if(!window.claude||!claude.use){msg(t("nodl"),"red");return}
    claude.use("downloads").then(function(dl){
      if(!dl){msg(t("nodl"),"red");return}
      return dl.save({filename:"Yousaf-Electronics-"+today()+".xlsx",data:buf}).then(function(){
        try{localStorage.setItem("ylb",String(Date.now()))}catch(e){}
        msg(t("saved"),"grn");render();
      });
    }).catch(function(e){if(e&&e.code=="declined")return;msg(t("nodl"),"red")});
  };
  window.xr=function(){
    if(typeof XLSX==="undefined"){msg(t("noxl"),"red");return}
    var inp=document.createElement("input");inp.type="file";inp.accept=".xlsx";
    inp.onchange=function(){
      var f=inp.files[0];if(!f)return;var r=new FileReader();

  /* ---- import old register from Excel ---- */

  window.impRows=function(rows){

<script>
(function(){
  T.syp=["Some data on this phone is not online yet","اس فون کا کچھ ڈیٹا ابھی آن لائن نہیں ہے"];
  T.sup=["📤 Upload to online","📤 آن لائن بھیجیں"];T.sdc=["Don't upload (use online data only)","نہ بھیجیں (صرف آن لائن ڈیٹا استعمال کریں)"];T.sla=["Decide later","بعد میں فیصلہ کریں"];
  T.sro=["You can view but not edit the online data. Ask the owner to make you a Contributor.","آپ آن لائن ڈیٹا دیکھ سکتے ہیں مگر بدل نہیں سکتے۔ مالک سے کہیں کہ آپ کو Contributor بنائے۔"];
  var DB=null,CANW=null,CW=true,READY=false,ERR="",SY={},PEND={},RUN={},Q=[],ACT=0,tm=null,FIRST={c:0,i:0,v:0},_sv=sv;
  function canon(o){
    if(o===null||typeof o!="object")return JSON.stringify(o);
    if(Array.isArray(o))return "["+o.map(canon).join(",")+"]";
    return "{"+Object.keys(o).sort().filter(function(k){return o[k]!==undefined}).map(function(k){return JSON.stringify(k)+":"+canon(o[k])}).join(",")+"}";
  }
  function clone(o){return JSON.parse(JSON.stringify(o))}
  function ids(){D.i.forEach(function(x){if(!x.id)x.id=uid()});D.v.forEach(function(x){if(!x.id)x.id=uid()})}
  function cur(){var m={};D.c.forEach(function(c){m["customers/"+c.id]=c});D.i.forEach(function(x){m["stock/"+x.id]=x});D.v.forEach(function(x){m["vendors/"+x.id]=x});m["meta/log"]={items:D.log||[]};return m}
  function busy(p){return PEND[p]||Q.some(function(x){return x.p==p})}
  function sst(){
    var e=$("#sy");if(!e)return;var x;
    if(!DB)x=["💾","This phone only","صرف اسی فون میں"];
    else if(!CW)x=["👁","View only","صرف دیکھنے کی اجازت"];
    else if(ERR&&!ACT&&!Q.length)x=["⚠","Sync problem — will retry","سنک میں مسئلہ، دوبارہ کوشش ہوگی"];
    else if(!READY)x=["☁","Connecting…","جڑ رہا ہے…"];
    else if(ACT||Q.length)x=["☁…","Syncing…","محفوظ ہو رہا ہے…"];
    else x=["☁✓","Saved online","آن لائن محفوظ"];
    e.textContent=x[0];e.title=x[ur?2:1];
  }
  function flush(){
    if(!DB||!CW||!READY)return;
    ids();var m=cur();
    Object.keys(m).forEach(function(p){
      var o=clone(m[p]),j=canon(o);
      if(SY[p]===j)return;
      if(p=="meta/log"&&SY[p]===undefined&&!(D.log&&D.log.length))return;
      SY[p]=j;Q=Q.filter(function(x){return x.p!=p});Q.push({p:p,o:o});
    });
    Object.keys(SY).forEach(function(p){if(!(p in m)){delete SY[p];Q=Q.filter(function(x){return x.p!=p});Q.push({p:p,del:1})}});
    pump();
  }
  function pump(){
    while(ACT<3){
      var i=-1;for(var k=0;k<Q.length;k++){if(!RUN[Q[k].p]){i=k;break}}
      if(i<0)break;
      var op=Q.splice(i,1)[0];RUN[op.p]=1;PEND[op.p]=(PEND[op.p]||0)+1;ACT++;
      (function(op){
        var r;try{r=op.del?DB.doc(op.p).delete():DB.doc(op.p).set(op.o)}catch(e){fin(op,e);return}
        r.then(function(){fin(op,null)},function(e){fin(op,e||{})});
      })(op);
    }
    sst();
  }
  function fin(op,e){
    delete RUN[op.p];PEND[op.p]--;if(!PEND[op.p])delete PEND[op.p];ACT--;
    if(e){
      ERR=e.code||"error";
      if(op.del)SY[op.p]="retry-delete";else delete SY[op.p];
      if(e.code=="invalid_argument"){if(CANW===true){SY[op.p]="bad"}else{CW=false;msg(t("sro"),"red")}}
      else if(e.code!="quota_exceeded"&&e.code!="revoked")setTimeout(flush,6000);
    }else if(!Q.length&&!ACT)ERR="";
    pump();
  }
  sv=function(){ids();_sv();clearTimeout(tm);tm=setTimeout(flush,500)};
  function msg(x,c){openM("<p class="+c+">"+x+"</p><div class=row><button class=b onclick=closeM()>"+t("close")+"</button></div>")}
  function onColl(coll,key,snap){
    var arr=D[key],ch=false;
    snap.docChanges().forEach(function(c){
      var d=c.doc,p=coll+"/"+d.id;if(busy(p))return;
      if(c.type=="removed"){
        var n=arr.length;arr=D[key]=arr.filter(function(x){return x.id!=d.id});delete SY[p];if(arr.length!=n)ch=true;return;
      }
      var o=clone(d.data());o.id=d.id;
      if(!/^[A-Za-z0-9_-]+$/.test(d.id))return;
      var j=canon(o);
      if(SY[p]===j)return;
      SY[p]=j;var k=-1;for(var q=0;q<arr.length;q++){if(arr[q].id==d.id){k=q;break}}
      if(k>=0)arr[k]=o;else arr.push(o);ch=true;
    });
    if(!snap.metadata.fromCache)FIRST[key]=1;
    if(ch){_sv();render()}
    if(!READY&&FIRST.c&&FIRST.i&&FIRST.v)decide();
    sst();
  }
  function localOnly(){
    var r={c:[],i:[],v:[]};
